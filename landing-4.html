<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StockLens Academy | שוק ההון מ-0 עד 100</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;font-family:'Heebo','Arial Hebrew',sans-serif;}
    html{scroll-behavior:smooth;direction:rtl;}
    body{
  background-color:#04080F;
  color:#EDF2FF;
  direction:rtl;
}
#root{position:relative;z-index:1;}
    .bg-grid{background-color:#04080F;}
    @media(max-width:768px){
      .bg-grid{background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:40px 40px;}
    }
    ::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:#070E1A;}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px;}
    :root{--green:#00E5A0;--blue:#5AABFF;--violet:#A78BFA;--gold:#F7C948;--rose:#FB7185;--cyan:#22D3EE;--border:rgba(255,255,255,.07);--text:#EDF2FF;--text2:#94A3B8;--text3:#475569;}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
    @keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
    @keyframes draw{from{stroke-dashoffset:2000}to{stroke-dashoffset:0}}
    .float{animation:float 6s ease-in-out infinite;}
    .glow-pulse{animation:glow 2.5s ease-in-out infinite;}
    .draw-anim{stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 2.8s ease-out .3s forwards;}
    .glass{background:rgba(11,21,40,.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);}
    .card-hover{transition:border-color .25s,box-shadow .25s,transform .25s;}
    .card-hover:hover{border-color:rgba(0,229,160,.3)!important;box-shadow:0 8px 40px rgba(0,229,160,.07),0 0 0 1px rgba(0,229,160,.1);transform:translateY(-3px);}
    .btn-green{background:linear-gradient(135deg,#00E5A0,#00B87D);color:#02060E;font-weight:700;border:none;cursor:pointer;transition:background .2s,box-shadow .2s,transform .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
    .btn-green:hover{background:linear-gradient(135deg,#00F0A8,#00CC8A);box-shadow:0 4px 28px rgba(0,229,160,.42);transform:translateY(-1px);}
    .btn-ghost{background:transparent;color:var(--text2);border:1px solid rgba(255,255,255,.12);cursor:pointer;transition:background .2s,border-color .2s,color .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
    .btn-ghost:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.24);color:var(--text);}
    .tg{background:linear-gradient(135deg,#00E5A0,#5AABFF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .tg-gold{background:linear-gradient(135deg,#F7C948,#E07B54);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .tg-inv{background:linear-gradient(135deg,#8E7CC3,#C9A96A);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .slabel{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green);}
    .nav-scrolled{background:rgba(4,8,15,.9)!important;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--border)!important;}
    .bg-grid{background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:56px 56px;}
    .pricing-card{background:linear-gradient(145deg,rgba(0,229,160,.07) 0%,rgba(10,18,35,.98) 55%);border:1px solid rgba(0,229,160,.3);box-shadow:0 0 80px rgba(0,229,160,.07);}
    .check-item{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
    .ic-green{background:rgba(0,229,160,.12);color:#00E5A0;}
    .ic-blue{background:rgba(90,171,255,.12);color:#5AABFF;}
    .ic-violet{background:rgba(167,139,250,.12);color:#A78BFA;}
    .ic-gold{background:rgba(247,201,72,.12);color:#F7C948;}
    .ic-rose{background:rgba(251,113,133,.12);color:#FB7185;}
    .ic-cyan{background:rgba(34,211,238,.12);color:#22D3EE;}
    .nav-link{font-size:14px;padding:8px 14px;border-radius:10px;color:var(--text2);text-decoration:none;transition:color .2s,background .2s;}
    .nav-link:hover{color:var(--text);background:rgba(255,255,255,.05);}
    .inv-card{border-radius:16px;padding:20px;border:1px solid rgba(255,255,255,.07);background:rgba(11,21,40,.6);transition:all .25s;}
    .inv-card:hover{transform:translateY(-3px);}
    @media(max-width:768px){.hero-chart-col{display:none!important;}}
  </style>
</head>
<body>
<!-- Background layer - real divs, not pseudo-elements -->
<div id="bg-glow-green" style="position:fixed;top:-20%;right:-10%;width:80vw;height:80vw;max-width:700px;max-height:700px;border-radius:50%;background:radial-gradient(circle,rgba(0,229,160,.18) 0%,transparent 65%);pointer-events:none;z-index:0;"></div>
<div id="bg-glow-blue" style="position:fixed;bottom:-20%;left:-10%;width:70vw;height:70vw;max-width:600px;max-height:600px;border-radius:50%;background:radial-gradient(circle,rgba(90,171,255,.14) 0%,transparent 65%);pointer-events:none;z-index:0;"></div>
<div id="bg-grid" style="position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;z-index:0;"></div>
<div id="root" style="position:relative;z-index:1;"></div>

          <p style={{fontSize:'13px',color:'#475569',lineHeight:'1.75',maxWidth:'210px'}}>9 כלי ניתוח חיים · 12 פרקים · עברית 100% · תשלום חד פעמי · גישה לנצח.</p>
        </div>
        {[
          {title:'כלים',links:['Overview','Quarter Compare','Stock vs Stock','Intelligence','Market Pulse','Options P/C']},
          {title:'תוכן',links:['12 פרקי לימוד','+60 נושאים','Investment Board','Spread Simulator','Watchlist']},
          {title:'כללי',links:['אודות','צור קשר','פרטיות','תנאי שימוש','רכוש גישה']},
        ].map(col=>(
          <div key={col.title}>
            <div style={{fontSize:'13px',fontWeight:'700',color:'#EDF2FF',marginBottom:'16px',letterSpacing:'.04em'}}>{col.title}</div>
            <ul style={{listStyle:'none',padding:0,margin:0}}>
              {col.links.map(l=>(
                <li key={l} style={{marginBottom:'10px'}}>
                  <a href="#" style={{fontSize:'13px',color:'#475569',textDecoration:'none',transition:'color .2s'}}
                    onMouseEnter={e=>e.target.style.color='#94A3B8'} onMouseLeave={e=>e.target.style.color='#475569'}>{l}</a>
                </li>
              ))}
            </ul>
          </div>
        ))}
      </div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:'12px',paddingTop:'24px',borderTop:'1px solid rgba(255,255,255,.06)'}}>
        <div style={{fontSize:'13px',color:'#475569'}}>© 2026 StockLens by Lidor.F · כל הזכויות שמורות.</div>
        <div style={{fontSize:'13px',color:'#475569'}}>FINANCIAL ANALYZER · Academy</div>
      </div>
    </div>
  </footer>
);

const App=()=>{
  const [scrolled,setScrolled]=useState(false);
  useEffect(()=>{
    const h=()=>setScrolled(window.scrollY>55);
    window.addEventListener('scroll',h,{passive:true});
    return()=>window.removeEventListener('scroll',h);
  },[]);
  return(<><Navbar scrolled={scrolled}/><main><Hero/><Products/><Tools/><Board/><Pricing/><CTABanner/></main><Footer/></>);
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
