  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;font-family:'Heebo','Arial Hebrew',sans-serif;}
    html{scroll-behavior:smooth;direction:rtl;}
    body{background:#020814;color:#EDF2FF;direction:rtl;overflow-x:hidden;}
    ::-webkit-scrollbar{width:4px;}
    ::-webkit-scrollbar-track{background:#020814;}
    ::-webkit-scrollbar-thumb{background:rgba(0,229,160,.2);border-radius:4px;}
    :root{
      --green:#00E5A0;--blue:#5AABFF;--violet:#A78BFA;--gold:#F7C948;--rose:#FB7185;--cyan:#22D3EE;
      --border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.1);
      --text:#EDF2FF;--text2:#94A3B8;--text3:#475569;
      --surface:rgba(8,16,36,.7);--surface2:rgba(12,22,48,.6);
    }

    /* ── Animations ── */
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes glow{0%,100%{opacity:.4}50%{opacity:1}}
    @keyframes draw{from{stroke-dashoffset:2000}to{stroke-dashoffset:0}}
    @keyframes pulse-ring{0%{transform:scale(.9);opacity:.6}70%{transform:scale(1.4);opacity:0}100%{transform:scale(1.4);opacity:0}}
    @keyframes shimmer{0%{background-position:200% center}100%{background-position:-200% center}}
    @keyframes fade-up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fade-in{from{opacity:0}to{opacity:1}}
    @keyframes spin-slow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes aurora{0%,100%{opacity:.4;transform:translateX(0) translateY(0) scale(1)}33%{opacity:.6;transform:translateX(-30px) translateY(-20px) scale(1.05)}66%{opacity:.3;transform:translateX(20px) translateY(10px) scale(.95)}}

    .float{animation:float 6s ease-in-out infinite;}
    .glow-pulse{animation:glow 2.5s ease-in-out infinite;}
    .draw-anim{stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 2.8s ease-out .3s forwards;}
    .fade-up{animation:fade-up .6s ease-out both;}
    .fade-up-d1{animation:fade-up .6s ease-out .1s both;}
    .fade-up-d2{animation:fade-up .6s ease-out .2s both;}
    .fade-up-d3{animation:fade-up .6s ease-out .35s both;}
    .fade-up-d4{animation:fade-up .6s ease-out .5s both;}
    .aurora1{animation:aurora 12s ease-in-out infinite;}
    .aurora2{animation:aurora 16s ease-in-out infinite reverse;}

    /* ── Glass & Cards ── */
    .glass{background:rgba(8,16,36,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);}
    .glass2{background:rgba(12,22,48,.8);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--border2);}
    .card-hover{transition:border-color .25s,box-shadow .25s,transform .25s;}
    .card-hover:hover{border-color:rgba(0,229,160,.28)!important;box-shadow:0 8px 40px rgba(0,229,160,.06),0 0 0 1px rgba(0,229,160,.1);transform:translateY(-4px);}
    .card-glow{position:relative;overflow:hidden;}
    .card-glow::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0,rgba(0,229,160,.06) 0%,transparent 60%);pointer-events:none;z-index:0;}

    /* ── Buttons ── */
    .btn-green{background:linear-gradient(135deg,#00E5A0,#00C48A);color:#020814;font-weight:700;border:none;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;}
    .btn-green::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15),transparent);opacity:0;transition:opacity .2s;}
    .btn-green:hover{box-shadow:0 4px 32px rgba(0,229,160,.45);transform:translateY(-2px);}
    .btn-green:hover::after{opacity:1;}
    .btn-ghost{background:rgba(255,255,255,.04);color:var(--text2);border:1px solid rgba(255,255,255,.12);cursor:pointer;transition:all .25s;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;font-family:Heebo,sans-serif;font-weight:600;}
    .btn-ghost:hover{background:rgba(0,229,160,.07);border-color:rgba(0,229,160,.4);color:#00E5A0;box-shadow:0 0 20px rgba(0,229,160,.15);transform:translateY(-2px);}

    /* ── Text ── */
    .tg{background:linear-gradient(135deg,#00E5A0 0%,#5AABFF 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .tg-gold{background:linear-gradient(135deg,#F7C948,#E07B54);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .tg-violet{background:linear-gradient(135deg,#A78BFA,#5AABFF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .shimmer-text{background:linear-gradient(90deg,#94A3B8 0%,#EDF2FF 40%,#94A3B8 60%,#94A3B8 100%);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 4s linear infinite;}
    .slabel{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--green);}

    /* ── Nav ── */
    .nav-scrolled{background:rgba(2,8,20,.92)!important;backdrop-filter:blur(28px)!important;-webkit-backdrop-filter:blur(28px)!important;border-bottom:1px solid rgba(0,229,160,.1)!important;}
    .nav-link{font-size:14px;padding:7px 14px;border-radius:10px;color:var(--text2);text-decoration:none;transition:color .2s,background .2s;font-weight:500;}
    .nav-link:hover{color:var(--text);background:rgba(255,255,255,.05);}

    /* ── Icon colors ── */
    .ic-green{background:rgba(0,229,160,.1);color:#00E5A0;border:1px solid rgba(0,229,160,.18);}
    .ic-blue{background:rgba(90,171,255,.1);color:#5AABFF;border:1px solid rgba(90,171,255,.18);}
    .ic-violet{background:rgba(167,139,250,.1);color:#A78BFA;border:1px solid rgba(167,139,250,.18);}
    .ic-gold{background:rgba(247,201,72,.1);color:#F7C948;border:1px solid rgba(247,201,72,.18);}
    .ic-rose{background:rgba(251,113,133,.1);color:#FB7185;border:1px solid rgba(251,113,133,.18);}
    .ic-cyan{background:rgba(34,211,238,.1);color:#22D3EE;border:1px solid rgba(34,211,238,.18);}

    /* ── Background ── */
    .bg-grid{background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:60px 60px;}
    .pricing-card{background:linear-gradient(145deg,rgba(0,229,160,.08) 0%,rgba(8,16,36,.98) 50%);border:1px solid rgba(0,229,160,.25);box-shadow:0 0 100px rgba(0,229,160,.06);}
    .check-item{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;}

    /* ── Bento Grid ── */
    .bento-large{grid-column:span 2;}
    @media(max-width:768px){.bento-large{grid-column:span 1;}.hero-chart-col{display:none!important;}.bento-grid{grid-template-columns:1fr!important;}}
    @media(max-width:1024px){.bento-large{grid-column:span 1;}}

    /* ── Scroll reveal ── */
    .reveal{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease;}
    .reveal.visible{opacity:1;transform:translateY(0);}

    /* ── FAQ ── */
    .faq-item{border-bottom:1px solid rgba(255,255,255,.06);overflow:hidden;}
    .faq-item:last-child{border-bottom:none;}

    /* ── Steps ── */
    .step-line{position:absolute;top:24px;right:-50%;width:100%;height:1px;background:linear-gradient(90deg,rgba(0,229,160,.3),rgba(0,229,160,.05));z-index:0;}

    /* ── Noise texture ── */
    body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:1;opacity:.4;}
  
    /* ── BRIGHTNESS UPGRADE ── */

    /* Lighter background */
    body { background: #060d1f !important; }
    ::-webkit-scrollbar-track { background: #060d1f !important; }

    /* Stronger green glows throughout */
    :root {
      --green: #00FFB3;
      --accent: #00FFB3;
    }

    /* Boost glow animations */
    @keyframes glow {
      0%,100%{opacity:.6} 50%{opacity:1}
    }
    @keyframes aurora {
      0%,100%{opacity:.6;transform:translateX(0) translateY(0) scale(1)}
      33%{opacity:.85;transform:translateX(-30px) translateY(-20px) scale(1.07)}
      66%{opacity:.55;transform:translateX(20px) translateY(10px) scale(.96)}
    }

    /* Green button stronger glow */
    .btn-green {
      background: linear-gradient(135deg,#00FFB3,#00CC8A) !important;
      box-shadow: 0 0 40px rgba(0,255,179,.55), 0 8px 32px rgba(0,255,179,.35), inset 0 1px 0 rgba(255,255,255,.2) !important;
    }
    .btn-green:hover {
      box-shadow: 0 0 64px rgba(0,255,179,.75), 0 12px 40px rgba(0,255,179,.5) !important;
      transform: translateY(-3px) !important;
    }

    /* Brighter text */
    body { color: #F0F6FF !important; }

    /* Cards lighter background */
    .glass {
      background: rgba(14,24,52,.7) !important;
      border-color: rgba(255,255,255,.1) !important;
    }
    .glass2 {
      background: rgba(14,24,52,.85) !important;
    }
    .glass:hover {
      border-color: rgba(0,255,179,.35) !important;
      background: rgba(14,24,52,.85) !important;
    }

    /* Section backgrounds slightly lighter */
    section { background-color: transparent !important; }

    /* Ticker / accent color brighter */
    .ticker, [style*="color:'#00E5A0'"], [style*="color:#00E5A0"] {
      text-shadow: 0 0 40px rgba(0,255,179,.7), 0 0 80px rgba(0,255,179,.3) !important;
    }

    /* Gradient text brighter */
    .tg {
      background: linear-gradient(135deg,#00FFB3,#5AABFF) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      background-clip: text !important;
    }

    /* Nav border brighter */
    nav {
      border-bottom-color: rgba(0,255,179,.25) !important;
      box-shadow: 0 1px 0 rgba(0,255,179,.12), 0 4px 32px rgba(0,0,0,.4) !important;
    }

    /* Secondary text lighter */
    .sec-sub, p { color: #8BA3C0 !important; }

    /* Stats numbers brighter */
    .stat-num { filter: brightness(1.15); }

    /* Mobile improvements */
    @media (max-width:768px) {
      .btn-green {
        box-shadow: 0 0 32px rgba(0,255,179,.5), 0 6px 24px rgba(0,255,179,.3) !important;
      }
      body { background: #060d1f !important; }
    }

    </style>

<style id="parallax-system">
/* ── PARALLAX ORBS × 5 ── */
.p-orb{position:fixed;border-radius:50%;pointer-events:none;will-change:transform;}

/* Orb 1 — large green, top-right */
.p-orb-1{
  width:120vw;height:120vw;max-width:1200px;max-height:1200px;
  top:-30%;right:-25%;z-index:0;
  background:radial-gradient(circle,rgba(0,255,179,.55) 0%,rgba(0,255,179,.22) 22%,rgba(0,255,179,.05) 50%,transparent 68%);
  filter:blur(90px);
  animation:orbA 11s ease-in-out infinite;
}
/* Orb 2 — large blue, bottom-left */
.p-orb-2{
  width:100vw;height:100vw;max-width:1000px;max-height:1000px;
  bottom:-28%;left:-22%;z-index:0;
  background:radial-gradient(circle,rgba(90,171,255,.5) 0%,rgba(90,171,255,.2) 22%,rgba(90,171,255,.05) 50%,transparent 68%);
  filter:blur(90px);
  animation:orbB 15s ease-in-out infinite;
}
/* Orb 3 — violet, mid-center */
.p-orb-3{
  width:70vw;height:70vw;max-width:700px;max-height:700px;
  top:32%;left:22%;z-index:0;
  background:radial-gradient(circle,rgba(167,139,250,.4) 0%,rgba(167,139,250,.14) 25%,transparent 65%);
  filter:blur(70px);
  animation:orbC 19s ease-in-out infinite;
}
/* Orb 4 — cyan, lower-right */
.p-orb-4{
  width:75vw;height:75vw;max-width:750px;max-height:750px;
  top:58%;right:2%;z-index:0;
  background:radial-gradient(circle,rgba(34,211,238,.38) 0%,rgba(34,211,238,.12) 25%,transparent 65%);
  filter:blur(75px);
  animation:orbA 23s ease-in-out infinite reverse;
}
/* Orb 5 — rose, upper-center */
.p-orb-5{
  width:60vw;height:60vw;max-width:600px;max-height:600px;
  top:12%;left:42%;z-index:0;
  background:radial-gradient(circle,rgba(251,113,133,.28) 0%,rgba(251,113,133,.08) 25%,transparent 65%);
  filter:blur(65px);
  animation:orbB 27s ease-in-out infinite reverse;
}
@keyframes orbA{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(-90px,65px) scale(1.13)}
  66%{transform:translate(55px,-45px) scale(.91)}
}
@keyframes orbB{
  0%,100%{transform:translate(0,0) scale(1)}
  30%{transform:translate(100px,-75px) scale(1.18)}
  70%{transform:translate(-50px,40px) scale(.88)}
}
@keyframes orbC{
  0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(-70px,65px) scale(1.22)}
}

/* ── CURSOR GLOW — large, vivid ── */
.cursor-glow{
  position:fixed;width:1000px;height:1000px;border-radius:50%;
  pointer-events:none;z-index:2;
  background:radial-gradient(circle,rgba(0,255,179,.22) 0%,rgba(0,255,179,.08) 28%,rgba(90,171,255,.03) 50%,transparent 65%);
  transform:translate(-50%,-50%);
  transition:left .06s ease,top .06s ease;
  mix-blend-mode:screen;
  filter:blur(6px);
}

/* ── PARTICLES ── */
@keyframes particleFloat{
  0%,100%{transform:translateY(0) translateX(0) scale(1);opacity:.3;}
  20%{transform:translateY(-50px) translateX(20px) scale(1.4);opacity:.95;}
  50%{transform:translateY(-25px) translateX(-30px) scale(.75);opacity:.55;}
  80%{transform:translateY(-65px) translateX(15px) scale(1.25);opacity:.85;}
}

/* ── SHOOTING STARS ── */
.shooting-star{
  position:fixed;height:2px;border-radius:999px;
  pointer-events:none;z-index:3;
  background:linear-gradient(90deg,transparent,rgba(0,255,179,1),rgba(220,255,245,1),transparent);
  box-shadow:0 0 10px rgba(0,255,179,1),0 0 25px rgba(0,255,179,.6),0 0 50px rgba(0,255,179,.2);
  animation:shootAnim 1s ease-out forwards;
}
@keyframes shootAnim{
  0%{width:0;opacity:1;}
  25%{width:200px;opacity:1;}
  100%{width:260px;opacity:0;transform:translate(400px,140px);}
}

/* ── DEPTH GRID (scrolls slower = creates depth) ── */
.depth-grid{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(0,255,179,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,179,.03) 1px,transparent 1px);
  background-size:90px 90px;
  will-change:transform;
}

/* ── SCROLL REVEAL — bigger, more dramatic ── */
[data-reveal]{opacity:0;transition:opacity 1s cubic-bezier(.16,1,.3,1),transform 1s cubic-bezier(.16,1,.3,1);}
[data-reveal="up"]{transform:translateY(90px);}
[data-reveal="left"]{transform:translateX(-90px);}
[data-reveal="right"]{transform:translateX(90px);}
[data-reveal="scale"]{transform:scale(.78) translateY(30px);}
[data-reveal="fade"]{transform:translateY(30px);}
[data-reveal].in-view{opacity:1!important;transform:none!important;}

/* ── STAGGER delays ── */
[data-delay="1"]{transition-delay:.06s!important;}
[data-delay="2"]{transition-delay:.14s!important;}
[data-delay="3"]{transition-delay:.24s!important;}
[data-delay="4"]{transition-delay:.36s!important;}
[data-delay="5"]{transition-delay:.50s!important;}
[data-delay="6"]{transition-delay:.66s!important;}

/* ── PARALLAX LAYERS ── */
[data-parallax]{will-change:transform;}

/* ── CARD 3D TILT — strong glow on hover ── */
.tilt3d{
  transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s ease;
  transform-style:preserve-3d;
}
.tilt3d:hover{
  box-shadow:0 50px 120px rgba(0,255,179,.28),0 0 0 1.5px rgba(0,255,179,.4),0 0 80px rgba(0,255,179,.12)!important;
}

/* ── SECTION DIVIDERS ── */
.p-divider{height:1px;background:linear-gradient(90deg,transparent,rgba(0,255,179,.35),rgba(90,171,255,.25),transparent);margin:0;}

/* ── GRID DOTS ── */
.dots-bg{
  background-image:radial-gradient(rgba(0,255,179,.18) 1.5px,transparent 1.5px);
  background-size:48px 48px;background-position:center;
}

/* ── GLOW BEAM sweep on buttons ── */
@keyframes beamSweep{0%{left:-120%}100%{left:220%}}
.beam-sweep{position:relative;overflow:hidden;}
.beam-sweep::after{
  content:'';position:absolute;top:0;left:-120%;width:55%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);
  animation:beamSweep 2.8s ease-in-out infinite;pointer-events:none;
}

/* ── HERO WORD animation ── */
.hw{display:inline-block;opacity:0;animation:hwIn .7s cubic-bezier(.16,1,.3,1) forwards;}
@keyframes hwIn{to{opacity:1;transform:translateY(0) skewY(0)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes floatY2{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
</style>

<style id="world-class">

/* GRAD LINE */

/* MOBILE */

/* ══════════════ STAT COUNTER ══════════════ */
const StatCounter=({end,prefix='',suffix='',label,color})=>{
  const [val,setVal]=useState(0);
  const ref=useRef();
  useEffect(()=>{
    const io=new IntersectionObserver(([e])=>{
      if(!e.isIntersecting)return;
      io.disconnect();
      const dur=1700,t0=Date.now();
      const num=parseInt(String(end).replace(/\D/g,''))||0;
      if(!num){setVal(end);return;}
      const run=()=>{
        const p=Math.min((Date.now()-t0)/dur,1),eased=1-Math.pow(1-p,4);
        setVal(Math.round(num*eased));
        if(p<1)requestAnimationFrame(run);
      };
      requestAnimationFrame(run);
    },{threshold:.4});
    if(ref.current)io.observe(ref.current);
    return()=>io.disconnect();
  },[end]);
  return(
    <div ref={ref} style={{textAlign:'center'}}>
      <div className="stat-counter" style={{fontSize:'clamp(30px,3.5vw,50px)',fontWeight:900,
        color,lineHeight:1,marginBottom:'8px',letterSpacing:'-.02em'}}>{prefix}{val}{suffix}</div>
      <div style={{fontSize:'12px',color:'#475569',fontWeight:600,letterSpacing:'.04em'}}>{label}</div>
    </div>
  );
};

          e.target.classList.add('visible');
          obs.unobserve(e.target);
        }
      });
    },{threshold:.1,rootMargin:'0px 0px -40px 0px'});
    document.querySelectorAll('.reveal,.reveal-left,.reveal-right,.stagger').forEach(el=>obs.observe(el));
    return()=>obs.disconnect();
  },[]);

<script id="parallax-engine">
(function(){
  /* ═══ 1. INJECT ORBS × 5 + CURSOR GLOW + DEPTH GRID ═══ */
  ['p-orb p-orb-1','p-orb p-orb-2','p-orb p-orb-3','p-orb p-orb-4','p-orb p-orb-5'].forEach(cls=>{
    const d=document.createElement('div');d.className=cls;document.body.prepend(d);
  });
  const cg=document.createElement('div');cg.className='cursor-glow';document.body.appendChild(cg);
  const dg=document.createElement('div');dg.className='depth-grid';document.body.prepend(dg);

  /* ═══ 2. CURSOR GLOW ═══ */
  document.addEventListener('mousemove',e=>{
    cg.style.left=e.clientX+'px';
    cg.style.top=e.clientY+'px';
  },{passive:true});

  /* ═══ 3. PARTICLE FIELD — 60 glowing dots ═══ */
  (function(){
    const wrap=document.createElement('div');
    wrap.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;';
    const palette=[
      'rgba(0,255,179,.75)','rgba(0,255,179,.55)',
      'rgba(90,171,255,.65)','rgba(90,171,255,.45)',
      'rgba(167,139,250,.55)','rgba(34,211,238,.65)',
      'rgba(251,113,133,.45)','rgba(247,201,72,.4)'
    ];
    for(let i=0;i<60;i++){
      const p=document.createElement('div');
      const sz=(Math.random()*2.8+.6).toFixed(2);
      const col=palette[Math.floor(Math.random()*palette.length)];
      const dur=(Math.random()*20+12).toFixed(1);
      const del=(Math.random()*-28).toFixed(1);
      const tx=(Math.random()*100).toFixed(1);
      const ty=(Math.random()*100).toFixed(1);
      p.style.cssText=`position:absolute;width:${sz}px;height:${sz}px;border-radius:50%;`+
        `background:${col};left:${tx}%;top:${ty}%;`+
        `animation:particleFloat ${dur}s ${del}s ease-in-out infinite;`+
        `box-shadow:0 0 ${(sz*5).toFixed(1)}px ${col},0 0 ${(sz*10).toFixed(1)}px ${col.replace(/[\d.]+\)$/,'0.2)')};`;
      wrap.appendChild(p);
    }
    document.body.appendChild(wrap);
  })();

  /* ═══ 4. SHOOTING STARS ═══ */
  function spawnStar(){
    const s=document.createElement('div');
    s.className='shooting-star';
    s.style.left=(5+Math.random()*65)+'vw';
    s.style.top=(5+Math.random()*55)+'vh';
    s.style.transform=`rotate(${-10-Math.random()*35}deg)`;
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),1100);
  }
  setTimeout(spawnStar,600);
  setTimeout(spawnStar,2200);
  setInterval(spawnStar,3800);

  /* ═══ 5. SCROLL PARALLAX — strong depth multipliers ═══ */
  const orbs=[
    {cls:'.p-orb-1',sy: 0.32,sx:0},
    {cls:'.p-orb-2',sy:-0.26,sx:0},
    {cls:'.p-orb-3',sy: 0.18,sx: 0.05},
    {cls:'.p-orb-4',sy:-0.22,sx:-0.06},
    {cls:'.p-orb-5',sy: 0.28,sx: 0.07},
  ];
  let ticking=false;
  window.addEventListener('scroll',()=>{
    if(ticking)return;
    ticking=true;
    requestAnimationFrame(()=>{
      const sy=window.scrollY;
      orbs.forEach(({cls,sy:fy,sx:fx})=>{
        const el=document.querySelector(cls);
        if(el)el.style.transform=`translateY(${sy*fy}px) translateX(${sy*fx}px)`;
      });
      // Depth grid crawls at 1/20 speed — subtle floating floor
      dg.style.transform=`translateY(${sy*0.04}px)`;
      // Generic data-parallax elements
      document.querySelectorAll('[data-parallax]').forEach(el=>{
        const sp=parseFloat(el.dataset.parallax)||0.1;
        const rect=el.getBoundingClientRect();
        const off=(rect.top+sy-window.innerHeight/2)*sp;
        el.style.transform=`translateY(${off}px)`;
      });
      ticking=false;
    });
  },{passive:true});

  /* ═══ 6. CARD 3D TILT — 24° max, vivid shadow ═══ */
  function initTilt(){
    document.querySelectorAll('.tilt3d').forEach(card=>{
      if(card._tiltInit)return;
      card._tiltInit=true;
      card.addEventListener('mousemove',e=>{
        const r=card.getBoundingClientRect();
        const x=((e.clientX-r.left)/r.width-.5)*24;
        const y=((e.clientY-r.top)/r.height-.5)*-24;
        card.style.transform=`perspective(750px) rotateX(${y}deg) rotateY(${x}deg) translateY(-14px) scale(1.03)`;
        card.style.boxShadow=`0 50px 120px rgba(0,255,179,.28),0 0 0 1.5px rgba(0,255,179,.4),0 0 100px rgba(0,255,179,.14)`;
      },{passive:true});
      card.addEventListener('mouseleave',()=>{
        card.style.transform='';
        card.style.boxShadow='';
      },{passive:true});
    });
  }

  /* ═══ 7. INIT AFTER REACT RENDERS ═══ */
  const revealVariants=['up','left','right','scale','up','fade','up','up'];
  function initAfterRender(){
    // Tag section children with varied reveal directions
    document.querySelectorAll('section,main>div').forEach((sec,si)=>{
      Array.from(sec.children).forEach((child,ci)=>{
        if(!child.dataset.reveal&&child.tagName!=='SCRIPT'&&child.tagName!=='STYLE'){
          child.dataset.reveal=revealVariants[(si*3+ci)%revealVariants.length];
          child.dataset.delay=String(Math.min(ci+1,6));
        }
      });
      // Parallax the first ambient glow blob in each section
      const bg=sec.querySelector('div[style*="radial-gradient"]');
      if(bg&&!bg.dataset.parallax){bg.dataset.parallax=String((0.09+si*0.018).toFixed(3));}
    });

    // Tag every card in grid layouts for reveal + tilt
    document.querySelectorAll('[style*="grid"]').forEach(grid=>{
      Array.from(grid.children).forEach((card,ci)=>{
        if(!card.dataset.reveal){
          card.dataset.reveal=ci%3===0?'scale':ci%2===0?'left':'up';
          card.dataset.delay=String(Math.min(ci+1,6));
        }
        card.classList.add('tilt3d');
      });
    });

    // Intersection Observer — trigger reveals
    const io=new IntersectionObserver(entries=>{
      entries.forEach(e=>{
        if(e.isIntersecting){e.target.classList.add('in-view');io.unobserve(e.target);}
      });
    },{threshold:.05,rootMargin:'0px 0px -15px 0px'});
    document.querySelectorAll('[data-reveal]').forEach(el=>io.observe(el));

    initTilt();
  }

  setTimeout(initAfterRender,950);
  setTimeout(initTilt,2800);
})();
</script>

</body>
</html>
